<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>曲爸爸动画资产库</title>
  <link rel="stylesheet" href="./style.css">
<style>.toolbar{display:block}.filter-row{display:flex;align-items:center;gap:10px;margin:7px 0}.filter-row>span{width:64px;flex:0 0 64px;color:var(--muted);font-size:13px}.filter-row .chips{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}.filter-row .chips::-webkit-scrollbar{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(350px,1fr))}.card{min-height:202px}.preview{flex:4 1 0}.card-content{flex:1 1 0}.card-actions{justify-content:flex-end;margin-top:auto}.card-action{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px}.mini-button{display:block}.tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}</style>
</head>
<body>
<style>.topbar h1{font-size:0}.topbar h1:after{content:"曲爸爸动画资产库";font-size:24px}.login-box h2{font-size:0}.login-box h2:after{content:"曲爸爸动画资产库";font-size:18px}.card{min-height:160px}.preview{flex:4 1 0;width:auto;min-width:0;aspect-ratio:1;align-self:flex-start}.preview img{object-fit:contain;background:var(--card)}.card-content{position:relative;flex:1 1 0;padding-bottom:58px}.tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.card-actions{position:absolute;right:22px;bottom:22px;margin:0;display:flex;gap:8px}</style>
<style>.hidden{display:none!important}.login-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center}.login-box{width:340px;max-width:90vw;padding:30px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}.login-box h2{margin:5px 0 22px}.login-hint,.login-error{color:var(--muted);font-size:13px}.login-box input{display:block;width:100%;margin:9px 0;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.login-box button{width:100%;margin-top:8px}.login-error{min-height:18px;color:#e5484d}.grid{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}.card{min-height:160px}.preview{width:auto;min-width:0;flex:4 1 0;background:var(--card);background-image:none;aspect-ratio:1}.preview img{object-fit:contain;background:var(--card)}.card-content{padding:22px;flex:1 1 0;min-width:0;position:relative;padding-bottom:58px}.card-actions{display:flex;gap:8px;position:absolute;right:22px;bottom:22px;margin:0}.card-action{border:1px solid var(--line);border-radius:7px;padding:6px 11px;background:var(--card);color:var(--primary);text-decoration:none;cursor:pointer;font-size:12px}.card-action:hover{border-color:var(--primary)}.meta{margin-top:16px}.mini-button{display:block;margin-top:6px;border:1px dashed var(--primary);background:transparent;color:var(--primary);padding:5px 9px;border-radius:7px;cursor:pointer}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{min-height:180px}.preview{flex:4 1 0}.card-content{padding:14px;padding-bottom:58px}.tags{display:flex;flex-direction:column;align-items:flex-start}}</style>
  <div id="loginScreen" class="login-screen"><form id="loginForm" class="login-box"><p class="eyebrow">PERSONAL ASSET LIBRARY</p><h2>GLB 动画资产库</h2><p class="login-hint">请输入访问密码</p><input id="password" type="password" inputmode="numeric" autocomplete="current-password" autofocus placeholder="访问密码"><p id="loginError" class="login-error"></p><button class="button primary">进入资产库</button></form></div>
  <header class="topbar">
    <div><p class="eyebrow">PERSONAL ASSET LIBRARY</p><h1>GLB 动画资产库</h1></div>
    <div class="actions"><button id="settings" class="button">⚙ 设置</button><button id="upload" class="button primary">＋ 上传动画</button></div>
  </header>
  <section class="toolbar">
    <input id="search" class="search" placeholder="🔍 搜索动画名称…" autocomplete="off">
    <div class="filter-row"><span>来源</span><div id="sourceFilters" class="chips"></div></div>
    <div class="filter-row"><span>种族</span><div id="raceFilters" class="chips"></div></div>
    <div class="filter-row"><span>其他标签</span><div id="tagFilters" class="chips"></div></div>
  </section>
  <main><div id="grid" class="grid"></div><div id="empty" class="empty hidden">还没有动画资产<br><small>点击右上角「上传动画」开始建立你的库</small></div></main>

  <dialog id="uploadDialog"><form id="uploadForm" method="dialog"><div class="dialog-head"><h2 id="formTitle">上传动画</h2><button type="button" class="close" data-close>×</button></div>
    <label>名称 *<input id="name" required placeholder="例如：挥手待机"></label>
    <label>来源<select id="source"></select><button type="button" id="addSource" class="mini-button">＋新增来源</button></label>
    <label>种族 *<select id="race" required></select><button type="button" id="addRace" class="mini-button">＋新增种族</button></label>
    <label>其他标签<select id="tagPicker"></select><button type="button" id="addTag" class="mini-button">＋新增标签</button><input id="tags" placeholder="也可直接输入，逗号分隔"></label>
    <label>WEBP 动图预览 <input id="preview" type="file" accept="image/webp,.webp"></label>
    <label>GLB 动画文件 <input id="glb" type="file" accept=".glb,model/gltf-binary"></label>
    <p class="hint">预览图会按方形显示；文件会保存到本地资产库，之后请手动提交到 GitHub。</p><p id="uploadStatus" class="status"></p>
    <div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button class="button primary" id="submitUpload">上传并保存</button></div>
  </form></dialog>
  <dialog id="settingsDialog"><form id="settingsForm" method="dialog"><div class="dialog-head"><h2>设置 · 管理枚举</h2><button type="button" class="close" data-close>×</button></div><div id="enumGroups"></div><p class="hint">重命名会同步更新动画；仍被使用的枚举不能删除。</p><div class="dialog-actions"><button type="button" class="button" data-close>关闭</button></div></form></dialog>
  <style>.size-control{display:flex;align-items:center;gap:8px;margin:0 0 0 auto;color:var(--muted);white-space:nowrap}.size-control input{width:130px;accent-color:var(--primary)}.size-control output{width:28px;color:var(--text)}.enum-group{margin:14px 0}.enum-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:7px}.enum-items{display:flex;flex-direction:column;gap:6px}.enum-item{display:flex;align-items:center;gap:7px}.enum-item span{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.enum-item button{border:1px solid var(--line);background:var(--card);color:var(--primary);border-radius:7px;padding:6px 9px;cursor:pointer}</style>
  <style>.grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.card{min-height:101px;border-radius:10px}.preview{flex:4 1 0;width:auto;min-width:0;height:auto;aspect-ratio:1}.card-content{flex:1 1 0;padding:8px 10px;justify-content:flex-start}.card-name{margin:0;text-align:left}.tags{margin-top:6px;text-align:left}.card-actions{right:8px;bottom:8px;gap:5px}.card-action{border:0;background:transparent;width:22px;height:22px;padding:0;font-size:16px}.card-action:hover{border:0;background:transparent;color:var(--primary)}</style>
  <script src="./app.js"></script>
</body></html>
